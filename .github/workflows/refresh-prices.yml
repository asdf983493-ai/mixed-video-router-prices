name: Refresh shared prices

on:
  schedule:
    - cron: "23 4 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-shared-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Collect prices with Playwright
        env:
          PRICE_SITE_USERNAME: ${{ secrets.PRICE_SITE_USERNAME }}
          PRICE_SITE_PASSWORD: ${{ secrets.PRICE_SITE_PASSWORD }}
          PRICE_SITE_URL: https://old.nxrouyuan.top/
        run: npm run collect
      - name: Publish latest JSON
        run: |
          git config user.name "price-center-bot"
          git config user.email "price-center-bot@users.noreply.github.com"
          git add public/prices.json
          if git diff --cached --quiet; then
            echo "No price changes"
          else
            git commit -m "chore: refresh prices"
            git push
          fi
